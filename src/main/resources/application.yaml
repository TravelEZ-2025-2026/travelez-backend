spring:
  application:
    name: travelez_system
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  # Connect db
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  #JPA config
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    # show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # RabbitMQ config
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  
  # Redis config
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # Cache config
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
  
  ai:
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE # Tính khoảng cách giữa các vector
        dimensions: 768 # Số chiều vector của Gemini Text Embedding model
        initialize-schema: true

  profiles:
    active: dev

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  recaptcha:
    secret: ${RECAPTCHA_SECRET}
    verify-url: https://www.google.com/recaptcha/api/siteverify

gcp:
  bucket:
    name: ${GCS_BUCKET_NAME}
    credentials-path: ${GCS_CREDENTIALS_PATH}
    project-id: ${GCS_PROJECT_ID}

#JWT config
jwt:
  tokenHeader: Authorization
  secret: ${SECRET_JWT}
  expiration: ${JWT_EXPIRATION}
  tokenHead: 'Bearer '

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: "https://generativelanguage.googleapis.com/v1beta/models/"

  models:
    pro: "gemini-2.5-pro"
    flash: "gemini-2.5-flash"

server:
  port: 8080
  forward-headers-strategy: framework

travelez:
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
  secret-code: ${SECRET_CODE}
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  task:
    cleanup:
      batch-size: ${TASK_CLEANUP_BATCH_SIZE:100}
      days-to-keep: ${TASK_CLEANUP_DAYS_TO_KEEP:7}

# Content Moderation config
moderation:
  ai:
    provider: gemini
    model: gemini-1.5-flash
    timeout: 30000
    max-retries: 3
  queue:
    name: content.moderation.queue
    dlq-name: content.moderation.dlq
    exchange: content.moderation.exchange
  cache:
    ttl-hours: 24
