spring:
  application:
    name: travelez_system
  #Connect db
  datasource:
    url: jdbc:postgresql://localhost:5435/travelez
    username: travelez
    password: travelez
  #JPA config
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  recaptcha:
    secret: ${RECAPTCHA_SECRET}
    verify-url: https://www.google.com/recaptcha/api/siteverify

gcp:
  bucket:
    name: "travelez-media"
    credentials-path: "gcs-key.json"
    project-id: "travelez-480112"

#JWT config
jwt:
  tokenHeader: Authorization
  secret: ${SECRET_JWT}
  expiration: 604800 #(60*60*24*7)
  tokenHead: 'Bearer '

server:
  port: 8080

